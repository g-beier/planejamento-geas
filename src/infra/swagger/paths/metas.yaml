paths:
  /planos/{plano_id}/metas:
    get:
      summary: Listar metas do plano
      tags: [Meta]
      responses:
        "200":
          description: Lista de metas retornada com sucesso
    post:
      summary: Criar meta no plano
      tags: [Meta]
      responses:
        "201":
          description: Meta criada com sucesso

  /planos/{plano_id}/metas/{meta_id}:
    get:
      summary: Buscar meta
      tags: [Meta]
      responses:
        "200":
          description: Meta retornada com sucesso
        "404":
          description: Meta não encontrada
    put:
      summary: Atualizar meta
      tags: [Meta]
      responses:
        "200":
          description: Meta atualizada com sucesso
        "400":
          description: Dados inválidos
    delete:
      summary: Remover meta
      tags: [Meta]
      responses:
        "204":
          description: Meta removida com sucesso
