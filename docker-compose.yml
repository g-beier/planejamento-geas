version: "3.8"

services:
  db:
    image: postgres:15
    container_name: pg-plano-grupo
    restart: always
    environment:
      POSTGRES_DB: plano_grupo
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend

volumes:
  pgdata:

networks:
  backend:
